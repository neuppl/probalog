on:
  workflow_dispatch:
  push:
  pull_request:

name: benchmark

# One run per branch at a time, so the data.json commits land in order.
concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    # The organization's machine, so every run is on the same hardware.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      # The machine has no git, and without it checkout downloads a bare
      # archive that cannot be committed to. So git comes first, from
      # conda-forge into the same cache directory as everything else.
      - name: Provide git
        run: |
          command -v git >/dev/null && exit 0
          root="$HOME/.cache/probalog-bench"
          mamba="$root/bin/micromamba"
          if [ ! -x "$mamba" ]; then
            mkdir -p "$root/bin"
            curl -fsSL -o "$mamba" \
              https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-linux-64
            chmod +x "$mamba"
          fi
          [ -x "$root/git/bin/git" ] || MAMBA_ROOT_PREFIX="$root/mamba" \
            "$mamba" create -y -q -p "$root/git" -c conda-forge --override-channels git
          echo "$root/git/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v5

      # Racket is pinned to a fixed release rather than "current" so that a
      # change in the numbers can be attributed to a probalog commit rather
      # than to Racket moving underneath us.
      #
      # Both directories live outside the workspace on purpose. The package
      # being installed is the repository root, and `raco pkg install`
      # refuses to link a directory that encloses a collection path --
      # which either of these would, if nested inside it.
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: "x64"
          distribution: "full"
          version: "9.1"
          dest: "${{ runner.temp }}/racket"
          sudo: never

      - name: Point package installs at the addon dir
        run: echo "PLTADDONDIR=${{ runner.temp }}/racket-addon" >> "$GITHUB_ENV"

      - name: Cache Racket packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/racket-addon
          key: racket-pkgs-${{ runner.os }}-${{ hashFiles('info.rkt') }}-${{ github.sha }}
          restore-keys: |
            racket-pkgs-${{ runner.os }}-${{ hashFiles('info.rkt') }}-
            racket-pkgs-${{ runner.os }}-

      # On a cache hit the package is already linked and `raco pkg install`
      # refuses, so update first and fall back to install on a cold cache.
      # `raco setup` is explicit so that compilation is not inside the
      # timings. An absolute path is required for the install.
      - name: Install probalog and its dependencies
        run: |
          raco pkg update --auto --no-docs probalog \
            || raco pkg install --auto --no-docs "$GITHUB_WORKSPACE"
          raco setup --no-docs --pkgs probalog

      # Every comparison system lives under ~/.cache/probalog-bench, which
      # stays on the machine between runs, so this does nothing after the
      # first.
      - name: Install benchmark systems
        run: examples/bench/setup.sh

      - name: Run every test, check and benchmark
        run: python3 examples/bench/collect.py

      # Annotations on the run page and tables on the Summary tab, all
      # derived from data.json and compared with the committed one. Fails
      # the job on failed tests, a ground-truth disagreement, or probalog
      # disagreeing with ProbLog, PITA, Souffle or its own other modes.
      - name: Report
        run: python3 examples/bench/report.py data.json

      - name: Upload data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-${{ github.sha }}
          path: data.json
          if-no-files-found: ignore

      # Committed even when the report fails, so the file always reflects
      # the latest run. [skip ci] keeps the commit from starting another
      # run; rebasing onto the branch tip lets it land after a newer push.
      - name: Commit data.json
        if: >-
          !cancelled()
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          [ -f data.json ] || exit 0
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update data.json for ${GITHUB_SHA::12} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

      # Appending to a separate repository keeps the CI benchmark history.
      # Skipped unless a PAT is configured, and only from the default branch.
      - name: Append to benchmark history
        if: >-
          github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "no PAT secret configured; skipping history push"
            exit 0
          fi
          jq '.ci_benchmarks' data.json > results.json
          git clone --depth 1 \
            "https://x-access-token:$PAT@github.com/Smaran-Teja/probalog-bench-data.git" history
          mkdir -p history/results
          cp results.json "history/results/${{ github.sha }}.json"
          cd history
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "benchmark results for ${{ github.sha }}"
          git push
